<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog - Proyectos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fafafa;color:#1a1a1a;line-height:1.6}
.header{background:#fff;border-bottom:1px solid #e5e7eb;padding:24px 0;position:sticky;top:0;z-index:100}
.hc{max-width:1000px;margin:0 auto;padding:0 24px}
.header h1{font-size:28px;font-weight:700}
.header p{color:#6b7280;font-size:15px}
.filters{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 0}
.fc{max-width:1000px;margin:0 auto;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:8px 16px;border:1px solid #e5e7eb;background:#fff;border-radius:20px;font-size:14px;cursor:pointer;color:#6b7280}
.btn:hover{border-color:#1a1a1a;color:#1a1a1a}
.btn.active{background:#1a1a1a;color:#fff}
/* ★ Botón especial Peticiones TECH */
.btn-ideas{background:#ede9fe;color:#7c3aed;border-color:#ddd6fe}
.btn-ideas:hover{background:#ddd6fe;border-color:#7c3aed;color:#7c3aed}
.btn-ideas.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.main{max-width:1000px;margin:0 auto;padding:32px 24px}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:24px;margin-bottom:24px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;border:2px solid transparent}
.stat.active{border-color:#1a1a1a}
.stat span:first-child{font-weight:700;font-size:16px}
.s-green{background:#dcfce7;color:#16a34a}
.s-blue{background:#dbeafe;color:#2563eb}
.s-red{background:#fee2e2;color:#dc2626}
.s-gray{background:#f3f4f6;color:#6b7280}
.s-purple{background:#ede9fe;color:#7c3aed}
.s-orange{background:#ffedd5;color:#ea580c}
.s-yellow{background:#fef9c3;color:#ca8a04}
.summary{font-size:14px;background:#f3f4f6;padding:16px;border-radius:8px;white-space:pre-line}
.fbox{background:#f3f4f6;border-radius:8px;padding:16px;margin-bottom:24px}
.frow{display:flex;gap:24px;flex-wrap:wrap}
.fgrp{flex:1;min-width:200px}
.fgrp-title{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow-y:auto}
.tag{padding:4px 10px;border-radius:14px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #e5e7eb;color:#6b7280}
.tag:hover{border-color:#1a1a1a}
.tag.active{background:#2563eb;color:#fff;border-color:#2563eb}
.clr{font-size:12px;color:#dc2626;cursor:pointer;padding:4px 10px;background:#fee2e2;border-radius:14px;margin-top:20px}
.entry{display:grid;grid-template-columns:90px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid #f3f4f6}
.edate{font-size:13px;color:#6b7280}
.econtent{display:flex;flex-direction:column;gap:6px}
.etitle{font-size:15px;font-weight:600;color:#1a1a1a;text-decoration:none}
.etitle:hover{color:#2563eb}
.edesc{font-size:13px;color:#6b7280}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500}
.b-proj{background:#f3f4f6;color:#6b7280}
.b-epic{background:#e0e7ff;color:#4338ca}
.b-itype{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.b-bug{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.b-story{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.b-task{background:#f3f4f6;color:#4b5563;border:1px solid #d1d5db}
.b-sub{background:#fdf4ff;color:#9333ea;border:1px solid #e9d5ff}
.b-epic-type{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.b-itype-def{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}
.emeta{display:flex;gap:12px;font-size:12px;color:#6b7280;flex-wrap:wrap}
.overdue{color:#dc2626;font-weight:600}
.ikey{font-size:11px;color:#2563eb;text-decoration:none}
.cmt{font-size:13px;padding:10px 14px;background:#f3f4f6;border-radius:8px;margin-top:6px;border-left:3px solid #2563eb}
.loading{text-align:center;padding:60px}
.spin{width:48px;height:48px;border:4px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{width:100%;max-width:400px;height:12px;background:#e5e7eb;border-radius:6px;margin:20px auto;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#2563eb,#16a34a)}
.error{background:#fee2e2;color:#dc2626;padding:24px;border-radius:8px;text-align:center;margin:40px auto;max-width:600px}
.total{text-align:center;padding:16px;color:#6b7280;font-size:14px;background:#fff;border-radius:8px;margin-bottom:16px}
.pag{display:flex;justify-content:center;gap:16px;padding:24px}
.pag button{padding:10px 20px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;cursor:pointer}
.pag button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:640px){.entry{grid-template-columns:1fr}.frow{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const JIRA='https://educaedtech.atlassian.net';
const PROXY='https://jira-proxy.shopify-48b.workers.dev/?url=';
const PROJECTS=[
  {k:'SEI', n:'Euroinnova', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SH',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SEI/boards/489/backlog'
  }},
  {k:'SEH', n:'EducaHub', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/EDUCAHUB',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SEH/boards/490/backlog'
  }},
  {k:'SUM', n:'Unimiami', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SU',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SUM/boards/618/backlog'
  }},
  {k:'SST', n:'Structuralia', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SHOPIFY',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SST/boards/488/backlog'
  }},
  {k:'STP', n:'Temarioenpdf', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SHO',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/STP/boards/783/backlog'
  }},
  {k:'SFC', n:'Formación Continua', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SFC',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SFC/boards/750/backlog'
  }},
  {k:'SCL', n:'Centro Lengua Capman', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SCDLC',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SCL/boards/1416/backlog'
  }},
  {k:'SED', n:'Entorno Desarrollo', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SED',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SED/boards/519/backlog'
  }},
  {k:'SDG', n:'DG Formacion', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/SD',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/SDG/boards/1550/backlog'
  }},
  {k:'EHC', n:'EduHub Core', links:{
    Confluence:'https://educaedtech.atlassian.net/wiki/spaces/EC',
    Backlog:'https://educaedtech.atlassian.net/jira/software/c/projects/EHC/boards/652/backlog'
  }}
];

// ★ ID del filtro de Peticiones TECH
const FILTER_IDEAS = '13076';
// ★ Clave especial para distinguir el modo filtro
const MODE_IDEAS = '__IDEAS__';

const BLOCKED=['PTE REQUISITOS'];
const IGNORE=['COMPLETADA','CANCELADA','STANDBY','PTE REQUISITOS'];
const AUTO=['this work item','created based on','jira form','email address:','automation','automatically','transitioned'];

let S={all:[],flt:[],load:false,prog:0,tot:0,err:null,proj:'ALL',stat:null,epic:null,user:null,label:null,itype:null,epics:[],users:[],labels:[],itypes:[],pg:0};

const fmt=d=>d?new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
const trunc=(t,m=140)=>{if(!t)return'';const c=String(t).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();return c.length<=m?c:c.slice(0,m)+'...'};
const adf=a=>{if(!a)return'';if(typeof a==='string')return a;let t='';const r=n=>{if(!n)return;if(n.text)t+=n.text+' ';if(n.content)n.content.forEach(r)};r(a);return t.trim()};
const isAuto=t=>!t||AUTO.some(f=>t.toLowerCase().includes(f));
const getCmt=c=>{if(!c||!c.length)return'';for(let i=c.length-1;i>=0;i--){const t=adf(c[i]?.body);if(t&&!isAuto(t)&&t.length>10)return trunc(t,200)}return''};

const sCat=s=>{
  const x=(s||'').toUpperCase();
  if(x==='COMPLETADA')return'completed';
  if(x==='CANCELADA')return'cancelled';
  if(x==='EN PROGRESO')return'progress';
  if(x.includes('QA')||x.includes('APROBADO'))return'qa';
  if(BLOCKED.includes(x))return'blocked';
  if(x==='POR HACER'||x.includes('RECHAZADA'))return'rejected';
  return'todo';
};

const sBadge=s=>{
  const x=(s||'').toUpperCase();
  if(x==='COMPLETADA')return's-green';
  if(x==='CANCELADA')return's-orange';
  if(x==='EN PROGRESO')return's-blue';
  if(x.includes('QA')||x.includes('APROBADO'))return's-purple';
  if(BLOCKED.includes(x))return's-red';
  if(x==='POR HACER'||x.includes('RECHAZADA'))return's-yellow';
  return's-gray';
};
// ★ Color por tipo de issue
const iTypeBadge=t=>{
  const x=(t||'').toLowerCase();
  if(x.includes('bug'))return'b-bug';
  if(x.includes('story'))return'b-story';
  if(x.includes('epic'))return'b-epic-type';
  if(x.includes('task')||x==='tarea')return'b-task';
  if(x.includes('sub'))return'b-sub';
  return'b-itype-def';
};

const dueS=(d,s)=>{if(!d)return{c:'',t:''};const due=new Date(d),now=new Date();now.setHours(0,0,0,0);const diff=Math.ceil((due-now)/864e5);if(diff<0&&!IGNORE.includes((s||'').toUpperCase()))return{c:'overdue',t:'⚠️ Vencida: '};if(diff>=0&&diff<=3)return{c:'',t:'⏰ '};return{c:'',t:'📅 '}};

const extFlt=()=>{const em=new Map(),um=new Map(),lm=new Map(),tm=new Map();S.all.forEach(i=>{const e=i.fields.parent?.fields?.summary;if(e)em.set(e,(em.get(e)||0)+1);const u=i.fields.assignee?.displayName;if(u)um.set(u,(um.get(u)||0)+1);(i.fields.labels||[]).forEach(l=>{if(l)lm.set(l,(lm.get(l)||0)+1)});const t=i.fields.issuetype?.name;if(t)tm.set(t,(tm.get(t)||0)+1)});S.epics=[...em].sort((a,b)=>b[1]-a[1]).map(e=>({n:e[0],c:e[1]}));S.users=[...um].sort((a,b)=>b[1]-a[1]).map(u=>({n:u[0],c:u[1]}));S.labels=[...lm].sort((a,b)=>b[1]-a[1]).map(l=>({n:l[0],c:l[1]}));S.itypes=[...tm].sort((a,b)=>b[1]-a[1]).map(t=>({n:t[0],c:t[1]}))};
const appFlt=()=>{let f=[...S.all];if(S.stat)f=f.filter(i=>sCat(i.fields.status?.name)===S.stat);if(S.epic)f=f.filter(i=>i.fields.parent?.fields?.summary===S.epic);if(S.user)f=f.filter(i=>i.fields.assignee?.displayName===S.user);if(S.label)f=f.filter(i=>(i.fields.labels||[]).includes(S.label));if(S.itype)f=f.filter(i=>i.fields.issuetype?.name===S.itype);S.flt=f;S.pg=0};
const clrFlt=()=>{S.stat=null;S.epic=null;S.user=null;S.label=null;S.itype=null;S.flt=[...S.all];S.pg=0};

async function load(){
S.load=true;S.all=[];S.flt=[];S.prog=0;S.tot=0;S.err=null;clrFlt();render();
try{
  // ★ Si estamos en modo Peticiones TECH, usamos el filtro; si no, proyectos normales
  let jql;
  if(S.proj === MODE_IDEAS){
    jql = `filter=${FILTER_IDEAS} ORDER BY updated DESC`;
  } else {
    const pf=S.proj==='ALL'?`project IN ("${PROJECTS.map(p=>p.k).join('","')}")`:`project="${S.proj}"`;
    jql=`${pf} ORDER BY updated DESC`;
  }

  let npt=null,all=[];
  do{
    let url=`${JIRA}/rest/api/3/search/jql?jql=${encodeURIComponent(jql)}&maxResults=100&fields=summary,description,status,created,updated,resolutiondate,assignee,comment,duedate,parent,issuetype,labels`;
    if(npt)url+=`&nextPageToken=${encodeURIComponent(npt)}`;
    const res=await fetch(PROXY+encodeURIComponent(url),{headers:{'Accept':'application/json'}});
    if(!res.ok)throw new Error(`Error ${res.status}`);
    const data=await res.json();all=[...all,...(data.issues||[])];
    if(!S.tot&&data.total)S.tot=data.total;S.prog=all.length;render();
    npt=data.nextPageToken;if(npt)await new Promise(r=>setTimeout(r,50));
  }while(npt);

  // ★ En modo Ideas no filtramos épicas para mostrar todo
  S.all = S.proj === MODE_IDEAS
    ? all
    : all.filter(i=>(i.fields.issuetype?.name||'').toLowerCase()!=='epic');

  S.flt=[...S.all];extFlt();
}catch(e){S.err=e.message}
S.load=false;render();
}

function render(){document.getElementById('app').innerHTML=html();bindE()}

function html(){
const st=cStats(),hasF=S.stat||S.epic||S.user||S.label||S.itype;
const si=S.pg*50,ei=si+50,di=S.flt.slice(si,ei),tp=Math.ceil(S.flt.length/50);

// ★ Título y subtítulo dinámico según modo
const titleLabel = S.proj === MODE_IDEAS ? 'Peticiones TECH' : '🔄 Changelog';
const subtitleLabel = S.proj === MODE_IDEAS ? 'Ideas y propuestas del equipo' : 'Proyectos - EducaEdtech';

return`
<header class="header"><div class="hc"><h1>${titleLabel}</h1><p>${subtitleLabel}</p></div></header>
<nav class="filters"><div class="fc">
<button class="btn ${S.proj==='ALL'?'active':''}" data-p="ALL">Todos</button>
${PROJECTS.map(p=>`<button class="btn ${S.proj===p.k?'active':''}" data-p="${p.k}">${p.n}</button>`).join('')}
<!-- ★ Botón Peticiones TECH separado visualmente -->
<button class="btn btn-ideas ${S.proj===MODE_IDEAS?'active':''}" data-p="${MODE_IDEAS}">Peticiones TECH</button>
</div></nav>
<main class="main">
${S.err?`<div class="error">⚠️ ${S.err}<br><small>Verifica credenciales en Worker Cloudflare</small></div>`:''}
${S.load?`<div class="loading"><div class="spin"></div><p style="font-size:20px;font-weight:600">Cargando...</p><p style="font-size:32px;font-weight:700;color:#2563eb">${S.prog}${S.tot?' / '+S.tot:''}</p>${S.tot?`<div class="prog"><div class="prog-fill" style="width:${Math.round(S.prog/S.tot*100)}%"></div></div>`:''}</div>`:''}
${!S.load&&!S.err&&S.all.length?`
<div class="box"><div class="stats">
<div class="stat s-green ${S.stat==='completed'?'active':''}" data-s="completed"><span>${st.completed}</span><span>Completadas</span></div>
<div class="stat s-yellow ${S.stat==='rejected'?'active':''}" data-s="rejected"><span>${st.rejected}</span><span>Por hacer</span></div>
<div class="stat s-blue ${S.stat==='progress'?'active':''}" data-s="progress"><span>${st.progress}</span><span>En Progreso</span></div>
<div class="stat s-purple ${S.stat==='qa'?'active':''}" data-s="qa"><span>${st.qa}</span><span>En QA</span></div>
<div class="stat s-red ${S.stat==='blocked'?'active':''}" data-s="blocked"><span>${st.blocked}</span><span>Bloqueadas</span></div>
<div class="stat s-gray ${S.stat==='todo'?'active':''}" data-s="todo"><span>${st.todo}</span><span>Pendientes</span></div>
<div class="stat s-orange ${S.stat==='cancelled'?'active':''}" data-s="cancelled"><span>${st.cancelled}</span><span>Canceladas</span></div>
</div>
${genProjectLinks()}
${genHealthSummary(st)}
${genSummaryTable(st)}
${genITypeStats()}
${genLabelsTableInline()}
${genStoppers()}</div>
<div class="fbox"><div class="frow">
<div class="fgrp"><div class="fgrp-title">Épicas (${S.epics.length})</div><div class="tags">${S.epics.map(e=>`<span class="tag ${S.epic===e.n?'active':''}" data-e="${e.n}">${trunc(e.n,20)} (${e.c})</span>`).join('')||'Sin épicas'}</div></div>
<div class="fgrp"><div class="fgrp-title">Usuarios (${S.users.length})</div><div class="tags">${S.users.map(u=>`<span class="tag ${S.user===u.n?'active':''}" data-u="${u.n}">${u.n.split(' ')[0]} (${u.c})</span>`).join('')||'Sin usuarios'}</div></div>
<div class="fgrp"><div class="fgrp-title">Etiquetas (${S.labels.length})</div><div class="tags">${S.labels.map(l=>`<span class="tag ${S.label===l.n?'active':''}" data-l="${l.n}">${l.n} (${l.c})</span>`).join('')||'Sin etiquetas'}</div></div>
<div class="fgrp"><div class="fgrp-title">Tipo de issue (${S.itypes.length})</div><div class="tags">${S.itypes.map(t=>`<span class="tag ${S.itype===t.n?'active':''}" data-t="${t.n}">${t.n} (${t.c})</span>`).join('')||'Sin tipos'}</div></div>
${hasF?'<span class="clr" id="clr">✕ Limpiar</span>':''}
</div></div>
<div class="total">📊 <strong>${S.all.length}</strong> tareas${hasF?` → <strong>${S.flt.length}</strong> filtradas`:''}</div>
${di.map(rEntry).join('')}
${tp>1?`<div class="pag"><button id="prev" ${S.pg===0?'disabled':''}>← Anterior</button><span>Pág ${S.pg+1}/${tp}</span><button id="next" ${S.pg>=tp-1?'disabled':''}>Siguiente →</button></div>`:''}
`:''}
</main>`;
}

function cStats(){
  const s={completed:0,progress:0,blocked:0,todo:0,qa:0,cancelled:0,rejected:0};
  S.flt.forEach(i=>s[sCat(i.fields.status?.name)]++);
  return s;
}

function genITypeStats(){
  const t = S.flt.length || 1;
  const types = S.itypes.filter(tp => tp.n.toLowerCase() !== 'epic');
  if(!types.length) return '';
  const row = tp => {
    const active = S.itype === tp.n;
    return `<tr onclick="window._itClick('${tp.n.replace(/'/g,"\'")}')" style="cursor:pointer;${active?'background:#ede9fe;':''}">
      <td style="padding:6px 4px">🏷️ ${tp.n}</td>
      <td style="padding:6px 4px"><strong>${tp.c}</strong></td>
      <td style="padding:6px 4px">${Math.round(tp.c/t*100)}%</td>
    </tr>`;
  };
  return `
    <div style="margin-top:4px;margin-bottom:4px;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.05em">TIPO DE ISSUE</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin:0 0 20px">
      <thead><tr style="text-align:left;color:#6b7280;border-bottom:1px solid #e5e7eb"><th>Tipo</th><th>Cantidad</th><th>%</th></tr></thead>
      <tbody>${types.map(row).join('')}</tbody>
    </table>`;
}
window._itClick=n=>{S.itype=S.itype===n?null:n;appFlt();render()};

function genLabelsTableInline(){
  const t = S.flt.length || 1;
  if(!S.labels.length) return '';
  const row = l => {
    const active = S.label === l.n;
    return `<tr onclick="window._lbClick('${l.n.replace(/'/g,"\'")}')" style="cursor:pointer;${active?'background:#dbeafe;':''}">
      <td style="padding:6px 4px">🔖 ${l.n}</td>
      <td style="padding:6px 4px"><strong>${l.c}</strong></td>
      <td style="padding:6px 4px">${Math.round(l.c/t*100)}%</td>
    </tr>`;
  };
  return `
    <div style="margin-top:4px;margin-bottom:4px;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.05em">ETIQUETAS</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin:0 0 20px">
      <thead><tr style="text-align:left;color:#6b7280;border-bottom:1px solid #e5e7eb"><th>Etiqueta</th><th>Cantidad</th><th>%</th></tr></thead>
      <tbody>${S.labels.map(row).join('')}</tbody>
    </table>`;
}
window._lbClick=n=>{S.label=S.label===n?null:n;appFlt();render()};

function genSummaryTable(s){
  const t = S.flt.length || 1;
  const row = (icon, label, val) =>
    `<tr><td>${icon} ${label}</td><td><strong>${val}</strong></td><td>${Math.round(val/t*100)}%</td></tr>`;
  return `
  <table style="width:100%;font-size:13px;border-collapse:collapse;margin:12px 0 20px">
    <thead><tr style="text-align:left;color:#6b7280;border-bottom:1px solid #e5e7eb"><th>Estado</th><th>Cantidad</th><th>%</th></tr></thead>
    <tbody>
      ${row('✅','Completadas', s.completed)}
      ${row('🔁','Por hacer', s.rejected)}
      ${row('🔄','En progreso', s.progress)}
      ${row('🧪','En QA', s.qa)}
      ${row('🚫','Bloqueadas', s.blocked)}
      ${row('📋','Pendientes', s.todo)}
      ${row('🟠','Canceladas', s.cancelled)}
    </tbody>
  </table>`;
}


function genIssueTypeTable(){
  const t = S.flt.length || 1;
  if(!S.issueTypes.length) return '';
  const row = (name, val) => {
    const active = S.itype === name;
    return `<tr style="cursor:pointer;${active?'background:#ede9fe;':''}" data-it="${name}">
      <td style="padding:6px 4px">🏷️ ${name}</td>
      <td style="padding:6px 4px"><strong>${val}</strong></td>
      <td style="padding:6px 4px">${Math.round(val/t*100)}%</td>
    </tr>`;
  };
  return `
  <div style="margin-top:4px;margin-bottom:4px;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.05em">TIPO DE ISSUE</div>
  <table style="width:100%;font-size:13px;border-collapse:collapse;margin:0 0 20px">
    <thead><tr style="text-align:left;color:#6b7280;border-bottom:1px solid #e5e7eb"><th>Tipo</th><th>Cantidad</th><th>%</th></tr></thead>
    <tbody>${S.issueTypes.map(tp=>row(tp.n,tp.c)).join('')}</tbody>
  </table>`;
}

function genLabelsTable(){
  const t = S.flt.length || 1;
  if(!S.labels.length) return '';
  const row = (name, val) => {
    const active = S.label === name;
    return `<tr style="cursor:pointer;${active?'background:#dbeafe;':''}" data-lb="${name}">
      <td style="padding:6px 4px">🔖 ${name}</td>
      <td style="padding:6px 4px"><strong>${val}</strong></td>
      <td style="padding:6px 4px">${Math.round(val/t*100)}%</td>
    </tr>`;
  };
  return `
  <div style="margin-top:4px;margin-bottom:4px;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.05em">ETIQUETAS</div>
  <table style="width:100%;font-size:13px;border-collapse:collapse;margin:0 0 20px">
    <thead><tr style="text-align:left;color:#6b7280;border-bottom:1px solid #e5e7eb"><th>Etiqueta</th><th>Cantidad</th><th>%</th></tr></thead>
    <tbody>${S.labels.map(l=>row(l.n,l.c)).join('')}</tbody>
  </table>`;
}

function genProjectLinks(){
  // ★ En modo Ideas no mostramos enlaces de proyecto
  if(S.proj==='ALL'||S.proj===MODE_IDEAS)return'';
  const proj=PROJECTS.find(p=>p.k===S.proj);
  if(!proj||!proj.links)return'';
  const L=proj.links;
  let h=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">`;
  if(L.Confluence)h+=`<a href="${L.Confluence}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;color:#1a1a1a;text-decoration:none;font-weight:500"><span style="font-size:16px">📚</span>Confluence</a>`;
  if(L.Figma)h+=`<a href="${L.Figma}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;color:#1a1a1a;text-decoration:none;font-weight:500"><span style="font-size:16px">🎨</span>Figma</a>`;
  if(L.Backlog)h+=`<a href="${L.Backlog}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;color:#1a1a1a;text-decoration:none;font-weight:500"><span style="font-size:16px">📋</span>Backlog</a>`;
  h+=`</div>`;
  return h;
}

function genHealthSummary(s){
  const t = S.flt.length;
  if(!t) return '';
  let status, color;
  if(s.blocked >= 5 || s.todo >= 5){status='🔴 Salud - Riesgo alto';color='#dc2626';}
  else if(s.blocked >= 3 || s.todo >= 3){status='🟠 Salud - Progreso con riesgos';color='#ea580c';}
  else if(s.blocked === 0){status='🟢 Salud - Excelente';color='#16a34a';}
  else{status='🟠 Salud - Progreso con riesgos';color='#ea580c';}

  // ★ Nombre dinámico para Peticiones TECH
  const projName =
    S.proj === MODE_IDEAS ? 'Peticiones TECH' :
    S.proj === 'ALL' ? 'Todos los proyectos' :
    PROJECTS.find(p=>p.k===S.proj)?.n || S.proj;

  const pct = Math.round(s.completed / t * 100);
  let txt = `<strong>${status} – ${projName}</strong><br>`;
  txt += `${pct}% de las tareas están completadas (${s.completed} de ${t}).`;
  if(s.blocked) txt += `<br>🚫 <strong>${s.blocked} bloqueadas</strong> requieren atención.`;
  if(s.rejected) txt += `<br>🔁 ${s.rejected} por hacer/rechazadas.`;
  if(s.progress) txt += `<br>🔄 ${s.progress} tareas en progreso.`;
  if(s.todo)     txt += `<br>📋 ${s.todo} tareas pendientes.`;
  return `<div style="width:100%;box-sizing:border-box;background:#fff;border-left:6px solid ${color};padding:16px 20px;border-radius:8px;margin:16px 0;font-size:14px;line-height:1.6">${txt}</div>`;
}

function genStoppers(){
  const blockers=S.flt.filter(i=>BLOCKED.includes((i.fields.status?.name||'').toUpperCase()));
  if(!blockers.length)return'';
  let h=`<div style="margin-top:16px;padding:16px;background:#fee2e2;border-radius:8px;border:1px solid #fecaca">`;
  h+=`<div style="font-weight:600;color:#dc2626;margin-bottom:12px">🚨 STOPPERS (${blockers.length}) - Requieren atención inmediata</div>`;
  blockers.forEach(b=>{
    const st=b.fields.status?.name||'',assignee=b.fields.assignee?.displayName||'Sin asignar';
    h+=`<div style="padding:8px 0;border-bottom:1px solid #fecaca;font-size:13px">`;
    h+=`<a href="${JIRA}/browse/${b.key}" target="_blank" style="color:#dc2626;font-weight:600;text-decoration:none">${b.key}</a> `;
    h+=`<span style="color:#1a1a1a">${trunc(b.fields.summary,60)}</span><br>`;
    h+=`<span style="font-size:12px;color:#6b7280">${st} • ${assignee}</span></div>`;
  });
  h+=`</div>`;
  return h;
}

function rEntry(i){
  const st=i.fields.status?.name||'',pr=PROJECTS.find(p=>p.k===i.key.split('-')[0]),ds=dueS(i.fields.duedate,st);
  const ep=i.fields.parent?.fields?.summary,desc=i.fields.description?trunc(adf(i.fields.description),120):'';
  const cm=getCmt(i.fields.comment?.comments);
  return`<div class="entry"><div class="edate">${fmt(i.fields.updated)}</div><div class="econtent">
<a href="${JIRA}/browse/${i.key}" target="_blank" class="etitle">${i.fields.summary}</a>
${desc?`<p class="edesc">${desc}</p>`:''}
<div class="badges"><span class="badge ${sBadge(st)}">${st}</span>${pr?`<span class="badge b-proj">${pr.n}</span>`:''}${ep?`<span class="badge b-epic">${trunc(ep,18)}</span>`:''}<span class="badge ${iTypeBadge(i.fields.issuetype?.name)}">${i.fields.issuetype?.name||''}</span><a href="${JIRA}/browse/${i.key}" target="_blank" class="ikey">${i.key}</a></div>
<div class="emeta">${i.fields.duedate?`<span class="${ds.c}">${ds.t}${fmt(i.fields.duedate)}</span>`:''}<span>📅 Creado: ${fmt(i.fields.created)}</span><span>👤 ${i.fields.assignee?.displayName||'Sin asignar'}</span></div>
${cm?`<div class="cmt">💬 ${cm}</div>`:''}
</div></div>`;
}

function bindE(){
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.proj=b.dataset.p;load()});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.stat=S.stat===b.dataset.s?null:b.dataset.s;appFlt();render()});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.epic=S.epic===b.dataset.e?null:b.dataset.e;appFlt();render()});
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.user=S.user===b.dataset.u?null:b.dataset.u;appFlt();render()});
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.label=S.label===b.dataset.l?null:b.dataset.l;appFlt();render()});
  document.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{S.itype=S.itype===b.dataset.it?null:b.dataset.it;appFlt();render()});
  document.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{S.label=S.label===b.dataset.lb?null:b.dataset.lb;appFlt();render()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.itype=S.itype===b.dataset.t?null:b.dataset.t;appFlt();render()});
  document.getElementById('clr')?.addEventListener('click',()=>{clrFlt();render()});
  document.getElementById('prev')?.addEventListener('click',()=>{if(S.pg>0){S.pg--;render();scrollTo(0,0)}});
  document.getElementById('next')?.addEventListener('click',()=>{if(S.pg<Math.ceil(S.flt.length/50)-1){S.pg++;render();scrollTo(0,0)}});
}

render();load();
</script>
</body>
</html>
